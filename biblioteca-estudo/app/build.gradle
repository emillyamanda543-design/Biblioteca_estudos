plugins {
    id 'application'
    id 'eclipse'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories { mavenCentral() }

group = 'edu.curso'
version = '1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

javafx {
    version = '25'
    modules = ['javafx.controls']
}

dependencies {
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.3.3'
}

application {
    mainClass = 'edu.curso.view.TelaPrincipal'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Indica ao Eclipse que os JARs JavaFX devem ficar no Modulepath,
// evitando que sejam carregados simultaneamente no modulo nao nomeado.
eclipse {
    classpath {
        file {
            whenMerged { classpath ->
                classpath.entries.findAll { entry ->
                    entry.kind == 'lib' &&
                    entry.path.toLowerCase().contains('javafx-')
                }.each { entry ->
                    entry.entryAttributes['module'] = 'true'
                }
            }
        }
    }
}

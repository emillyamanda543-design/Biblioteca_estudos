plugins {
    id 'application'
    id 'eclipse'
}

group = 'edu.curso'
version = '1.0'
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

// Usa o JavaFX que acompanha o BellSoft Liberica JDK 25 Full.
// Evita duplicar módulos do JavaFX com bibliotecas baixadas separadamente.
dependencies {
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.3.3'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
}
application {
    mainClass = 'edu.curso.view.TelaPrincipal'
    applicationDefaultJvmArgs = ['--add-modules=javafx.controls', '--enable-native-access=javafx.graphics']
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['--add-modules', 'javafx.controls']
}

// Teste executável sem JUnit, usando DAOs em memória apenas no ambiente de testes.
tasks.register('verificarControles', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'edu.curso.VerificacaoControles'
    jvmArgs '--add-modules=javafx.controls'
}
